services:
    app:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mongodb:
                condition: service_healthy
            redis:
                condition: service_healthy

    mongodb:
        image: 'mongo:8'
        ports:
            - '${FORWARD_DB_PORT:-27017}:27017'
        environment:
            MONGO_INITDB_ROOT_USERNAME: '${DB_USERNAME}'
            MONGO_INITDB_ROOT_PASSWORD: '${DB_PASSWORD}'
            MONGO_INITDB_DATABASE: '${DB_DATABASE}'
        volumes:
            - 'sail-mongodb:/data/db'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mongosh
                - '--quiet'
                - '--eval'
                - "db.adminCommand('ping').ok"
            interval: 10s
            retries: 5
            timeout: 5s
            start_period: 20s

    queue:
        image: 'sail-8.5/app'
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600', '--sleep=1']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - app
        restart: unless-stopped
        stop_grace_period: 60s

    scheduler:
        image: 'sail-8.5/app'
        command: ['php', 'artisan', 'schedule:work']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - app
        restart: unless-stopped

    mongo-express:
        image: 'mongo-express:1'
        ports:
            - '${ME_PORT:-8081}:8081'
        environment:
            ME_CONFIG_MONGODB_URL: 'mongodb://${DB_USERNAME}:${DB_PASSWORD}@mongodb:27017/?authSource=admin'
            ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
            ME_CONFIG_BASICAUTH_USERNAME: '${ME_USERNAME:-admin}'
            ME_CONFIG_BASICAUTH_PASSWORD: '${ME_PASSWORD:-admin}'
        networks:
            - sail
        depends_on:
            mongodb:
                condition: service_healthy
        restart: unless-stopped

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

networks:
    sail:
        driver: bridge

volumes:
    sail-mongodb:
        driver: local
    sail-redis:
        driver: local
